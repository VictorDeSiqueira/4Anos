    <script>
        /* ============================================================
           0. EXECUÇÃO DO ÁUDIO LOCAL
           ============================================================ */
        function playMusic() {
            const music = document.getElementById('bg-music');
            if (music) {
                music.play().catch(function(error) {
                    console.log("Erro na reprodução do áudio (política de autoplay):", error);
                });
            }
        }

        /* ============================================================
           1. ANIMAÇÃO DE CORAÇÕES FLUTUANTES NO FUNDO
           ============================================================ */
        function createHeart() {
            const container = document.getElementById('hearts-container');
            if (!container) return;
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            
            const icons = ['fa-heart', 'fa-heart', 'fa-hand-holding-heart', 'fa-sparkles'];
            const randomIcon = icons[Math.floor(Math.random() * icons.length)];
            
            heart.innerHTML = '<i class="fa-solid ' + randomIcon + '"></i>';
            
            const left = Math.random() * 100;
            const size = Math.random() * 16 + 10;
            const duration = Math.random() * 5 + 5;
            
            heart.style.left = left + 'vw';
            heart.style.fontSize = size + 'px';
            heart.style.animationDuration = duration + 's';
            
            container.appendChild(heart);
            
            setTimeout(function() {
                heart.remove();
            }, duration * 1000);
        }

        setInterval(createHeart, 450);

        /* ============================================================
           2. LÓGICA DO BOTÃO "NÃO" FUJÃO (COM DOCKING / LIMITES MOBILE)
           ============================================================ */
        let naoEscapou = false;

        function fugirBotao(e) {
            if (e && e.preventDefault) {
                e.preventDefault();
            }

            const btnNao = document.getElementById('btn-nao');
            if (!btnNao) return;

            if (!naoEscapou) {
                btnNao.style.position = 'fixed';
                naoEscapou = true;
            }

            // Dimensões seguras da viewport para evitar extrapolar a tela no Mobile
            const padding = 20;
            const btnWidth = btnNao.offsetWidth || 100;
            const btnHeight = btnNao.offsetHeight || 50;

            const maxLeft = window.innerWidth - btnWidth - padding;
            const maxTop = window.innerHeight - btnHeight - padding;

            const newLeft = Math.max(padding, Math.floor(Math.random() * maxLeft));
            const newTop = Math.max(padding, Math.floor(Math.random() * maxTop));

            btnNao.style.left = newLeft + 'px';
            btnNao.style.top = newTop + 'px';
        }

        /* ============================================================
           3. TRANSIÇÃO DA TELA 1 PARA A TELA 2 + TOCA MÚSICA
           ============================================================ */
        function goToSecondScreen() {
            playMusic();

            const screen1 = document.getElementById('screen-pedido');
            const screen2 = document.getElementById('screen-historia');

            screen1.classList.remove('opacity-100');
            screen1.classList.add('opacity-0');

            setTimeout(function() {
                screen1.classList.add('hidden');
                
                screen2.classList.remove('hidden');
                screen2.classList.add('flex');
                setTimeout(function() {
                    screen2.classList.remove('opacity-0');
                    screen2.classList.add('opacity-100');
                }, 50);

                initCarousel();
            }, 500);
        }

        /* ============================================================
           4. LÓGICA DO CARROSSEL DE FOTOS & TOUCH SWIPE
           ============================================================ */
        let currentSlide = 0;
        const totalSlides = 10;
        let autoSlideInterval;

        function initCarousel() {
            const dotsContainer = document.getElementById('carousel-dots');
            if (!dotsContainer) return;

            dotsContainer.innerHTML = '';

            for (let i = 0; i < totalSlides; i++) {
                const dot = document.createElement('button');
                dot.ariaLabel = 'Ir para foto ' + (i + 1);
                dot.className = 'w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full transition-all duration-300 bg-white/50 hover:bg-white';
                if (i === 0) dot.className = 'w-5 sm:w-6 h-2.5 sm:h-3 rounded-full transition-all duration-300 bg-rose-600';
                
                (function(index) {
                    dot.addEventListener('click', function() { goToSlide(index); });
                })(i);

                dotsContainer.appendChild(dot);
            }

            // Suporte a gestos de deslizar (swipe) no mobile
            setupCarouselTouch();
            startAutoSlide();
        }

        function updateCarousel() {
            const track = document.getElementById('carousel-track');
            if (track) {
                track.style.transform = 'translateX(-' + (currentSlide * 100) + '%)';
            }

            const dots = document.getElementById('carousel-dots') ? document.getElementById('carousel-dots').children : [];
            for (let i = 0; i < dots.length; i++) {
                if (i === currentSlide) {
                    dots[i].className = 'w-5 sm:w-6 h-2.5 sm:h-3 rounded-full transition-all duration-300 bg-rose-600';
                } else {
                    dots[i].className = 'w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full transition-all duration-300 bg-white/50 hover:bg-white';
                }
            }
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % totalSlides;
            updateCarousel();
            resetAutoSlide();
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
            updateCarousel();
            resetAutoSlide();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateCarousel();
            resetAutoSlide();
        }

        function startAutoSlide() {
            clearInterval(autoSlideInterval);
            autoSlideInterval = setInterval(function() {
                currentSlide = (currentSlide + 1) % totalSlides;
                updateCarousel();
            }, 4000);
        }

        function resetAutoSlide() {
            clearInterval(autoSlideInterval);
            startAutoSlide();
        }

        /* Suporte a toque/deslize no mobile */
        function setupCarouselTouch() {
            const track = document.getElementById('carousel-track');
            if (!track) return;

            let touchStartX = 0;
            let touchEndX = 0;

            track.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            track.addEventListener('touchend', function(e) {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });

            function handleSwipe() {
                const swipeThreshold = 40;
                if (touchStartX - touchEndX > swipeThreshold) {
                    nextSlide();
                } else if (touchEndX - touchStartX > swipeThreshold) {
                    prevSlide();
                }
            }
        }
    </script>
</body>
