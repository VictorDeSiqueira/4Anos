            animation: fall linear infinite;
            z-index: 0;
            pointer-events: none;

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(360deg) scale(1.2);

            background: rgba(255, 255, 255, 0.85);

    <script>
        /* ============================================================
           0. EXECUÇÃO DO ÁUDIO LOCAL
           ============================================================ */
        function playMusic() {
            const music = document.getElementById('bg-music');
            if (music) {
                music.play().catch(function(error) {
                    console.log("Erro na reprodução do áudio:", error);
                });
            }
        }

        /* ============================================================
           1. ANIMAÇÃO DE CORAÇÕES FLUTUANTES NO FUNDO
           ============================================================ */
        function createHeart() {
            const container = document.getElementById('hearts-container');
            if (!container) return;
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            
            const icons = ['fa-heart', 'fa-heart', 'fa-hand-holding-heart', 'fa-sparkles'];
            const randomIcon = icons[Math.floor(Math.random() * icons.length)];
            
            heart.innerHTML = `<i class="fa-solid ${randomIcon}"></i>`;
            
            const left = Math.random() * 100;
            const size = Math.random() * 20 + 10;
            const duration = Math.random() * 5 + 5;
            
            heart.style.left = left + 'vw';
            heart.style.fontSize = size + 'px';
            heart.style.animationDuration = duration + 's';
            
            container.appendChild(heart);
            
            setTimeout(function() {
                heart.remove();
            }, duration * 1000);
        }

        setInterval(createHeart, 400);

        /* ============================================================
           2. LÓGICA DO BOTÃO "NÃO" FUJÃO
           ============================================================ */
        let naoEscapou = false;

        function fugirBotao() {
            const btnNao = document.getElementById('btn-nao');
            
            if (!naoEscapou) {
                btnNao.style.position = 'fixed';
                naoEscapou = true;
            }

            const margin = 50;
            const maxX = window.innerWidth - btnNao.offsetWidth - margin;
            const maxY = window.innerHeight - btnNao.offsetHeight - margin;

            const newX = Math.max(margin, Math.floor(Math.random() * maxX));
            const newY = Math.max(margin, Math.floor(Math.random() * maxY));

            btnNao.style.left = newX + 'px';
            btnNao.style.top = newY + 'px';
        }

        /* ============================================================
           3. TRANSIÇÃO DA TELA 1 PARA A TELA 2 + TOCA MÚSICA
           ============================================================ */
        function goToSecondScreen() {
            playMusic();

            const screen1 = document.getElementById('screen-pedido');
            const screen2 = document.getElementById('screen-historia');

            screen1.classList.remove('opacity-100');
            screen1.classList.add('opacity-0');

            setTimeout(function() {
                screen1.classList.add('hidden');
                
                screen2.classList.remove('hidden');
                setTimeout(function() {
                    screen2.classList.remove('opacity-0');
                    screen2.classList.add('opacity-100');
                }, 50);

                initCarousel();
            }, 500);
        }

        /* ============================================================
           4. LÓGICA DO CARROSSEL DE FOTOS
           ============================================================ */
        let currentSlide = 0;
        const totalSlides = 10;
        let autoSlideInterval;

        function initCarousel() {
            const dotsContainer = document.getElementById('carousel-dots');
            dotsContainer.innerHTML = '';

            for (let i = 0; i < totalSlides; i++) {
                const dot = document.createElement('button');
                dot.className = 'w-3 h-3 rounded-full transition-all duration-300 bg-white/50 hover:bg-white';
                if (i === 0) dot.className = 'w-6 h-3 rounded-full transition-all duration-300 bg-rose-600';
                dot.addEventListener('click', (function(index) {
                    return function() { goToSlide(index); };
                })(i));
                dotsContainer.appendChild(dot);
            }

            startAutoSlide();
        }

        function updateCarousel() {
            const track = document.getElementById('carousel-track');
            track.style.transform = 'translateX(-' + (currentSlide * 100) + '%)';

            const dots = document.getElementById('carousel-dots').children;
            for (let i = 0; i < dots.length; i++) {
                if (i === currentSlide) {
                    dots[i].className = 'w-6 h-3 rounded-full transition-all duration-300 bg-rose-600';
                } else {
                    dots[i].className = 'w-3 h-3 rounded-full transition-all duration-300 bg-white/50 hover:bg-white';
                }
            }
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % totalSlides;
            updateCarousel();
            resetAutoSlide();
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
            updateCarousel();
            resetAutoSlide();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateCarousel();
            resetAutoSlide();
        }

        function startAutoSlide() {
            autoSlideInterval = setInterval(function() {
                currentSlide = (currentSlide + 1) % totalSlides;
                updateCarousel();
            }, 4000);
        }

        function resetAutoSlide() {
            clearInterval(autoSlideInterval);
            startAutoSlide();
        }
    </script>
</body>
</html>
